<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="css/style.css">

<body>

  <header id="site-header"></header>

  <div class="breadcrumbs">

  </div>

  <div class="page-title">
    <h1>Ответы на вопросы</h1>
    <div class="subtitle">Ответы на часто задаваемые вопросы</div>
  </div>

  <section class="patchwork-bg" style="padding-top:0;">
    <div class="container">
      <div class="audio-list">
        <div class="audio-row">
          <div class="num">01</div>
          <div class="info">
            <h3>«О бороде» от шейха Шади Эльмасри</h3>
            <div class="duration">11:39</div>
          </div>
          <div class="audio-actions">
            <a class="audio-btn" href="assets/audio/qa-01-beard.m4a" download>↓ Скачать</a>
            <button class="audio-btn play js-play"
                    data-src="assets/audio/qa-01-beard.m4a"
                    data-title="«О бороде» от шейха Шади Эльмасри"
                    data-sub="Устаз Исмаил Кривцов">

        </div>

      </div>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <div class="player" id="player">
    <div class="player-info">
      <div class="player-cover"><span></span><span></span><span></span><span></span></div>

        <div class="title" id="player-title">—</div>

      </div>
    </div>
    <div class="player-controls">
      <button class="player-btn" id="player-toggle" aria-label="Воспроизвести"><span class="icon-play-css"></span></button>
    </div>
    <div class="player-progress">
      <span class="player-time" id="player-time-current">0:00</span>
      <div class="progress-bar" id="player-progress"><div id="player-fill" style="width:0%"></div></div>
      <span class="player-time" id="player-time-total">0:00</span>
    </div>
    <button class="player-close" id="player-close" aria-label="Закрыть плеер">×</button>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/player.js"></script>
